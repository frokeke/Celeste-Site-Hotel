<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>
        Cadastro
    </title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="./style/cadastro.css">
</head>

<body>
<div class ="center">
    <div class="log-container">
        <div class="log-left">
            <h1 class="log-title">
                 <img class="img-logo" src="https://i.imgur.com/Dcg490I.png" width="200" height="200">
            </img>

            <form id="register-form" class="log-form">
                <div class="input-group">
                    <label> Nome </label>
                    <input type="text" id="name" placeholder="Seu nome">
                </div>

                <div class="input-group">
                    <label> Email </label>
                    <input type="email" id="email" placeholder="Seu email">
                </div>

                <div class="input-group">
                    <label> Senha </label>
                    <input type="password" id="password" placeholder="Crie uma senha">
                </div>

                <button type="submit" class="log-button"> Cadastrar </button>

            </form>
            <p class="log-link">
                Já possui conta? 
                <a href="./login.html">
                    Entrar
                </a>
            </p>
        </div>
    </div>
</div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
