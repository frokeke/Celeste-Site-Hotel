<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title> Login </title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="./style/login.css">
</head>

<body>
    <div class ="center">
    <div class="log-container">
        <div class="log-left">
            <h1 class="log-title">
                <img class="img-logo" src="https://i.imgur.com/Dcg490I.png" width="200" height="200">
            </img>
            </h1>
            <p class="error-message">
            </p>

            <form id="login-form" class="log-form">
                <div class="input-group">
                    <label> Usuário </label>
                    <input type="email" id="email" placeholder="ex.: fulano@gmail.com">
                </div>

                <div class="input-group">
                    <label> Senha </label>
                    <input type="password" id="password" placeholder="ex.: 123">
                </div>

                <p class="forgot-password">
                    Esqueci minha senha
                </p>

                <button type="submit" class="log-button">Entrar </button>
            </form>

            <p class="log-link">
                Não possui conta?
                <a href="./cadastro.html"> Cadastre-se </a>
            </p>
        </div>
        </div>
        </div>
    </div>
</div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
